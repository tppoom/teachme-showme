document.addEventListener("keydown",function(e){
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){ if(e.key==="Escape"){closeSearch();e.target.blur()} return }
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var i=chapters.indexOf(cur);
  if(e.key==="/"){e.preventDefault();document.body.classList.remove("menu");q.focus()}
  else if(e.key==="j"||e.key==="J"){if(i<chapters.length-1)go(chapters[i+1].id)}
  else if(e.key==="k"||e.key==="K"){if(i>0)go(chapters[i-1].id); else if(i===0)go("home")}
  else if(e.key==="m"||e.key==="M"){if(cur){var mk=$(".mark",cur);if(mk)mk.click()}}
  else if(e.key==="t"||e.key==="T"){$("#themeBtn").click()}
  else if(e.key==="Escape"){document.body.classList.remove("menu")}
});

/* ---------------- headings in scripts without word spaces ----------------
   Thai, Lao, Khmer and Burmese break between any two words, so a heading can split a phrase
   ("พนักงาน|ใหม่"). Writers put spaces between phrases; in headings only those may break.
   A phrase wider than its column is released again (.wide), so nothing overflows. */
(function(){
  if(!/^(th|lo|km|my)\b/i.test(document.documentElement.lang||""))return;
  var SEA=/[\u0e00-\u0eff\u1000-\u109f\u1780-\u17ff]/;
  $$(".cv-title,.ch-title,.ch-body h2,.eg-h,.nv-x,.toc-t,.nc-t").forEach(function(h){
    var tw=document.createTreeWalker(h,NodeFilter.SHOW_TEXT,null), t, list=[];
    while((t=tw.nextNode()))list.push(t);
    list.forEach(function(t){
      if(!SEA.test(t.nodeValue)||t.parentNode.closest("code"))return;
      var f=document.createDocumentFragment();
      t.nodeValue.split(/( +)/).forEach(function(part){
        if(!part)return;
        if(/^ +$/.test(part)||!SEA.test(part)){f.appendChild(document.createTextNode(part));return}
        var sp=document.createElement("span"); sp.className="nwa"; sp.textContent=part; f.appendChild(sp);
      });
      t.parentNode.replaceChild(f,t);
    });
  });
  function release(){$$(".nwa").forEach(function(sp){sp.classList.remove("wide");
    var box=sp.parentNode.closest("h1,h2,.eg-h,.nv-x,.toc-t,.nc-t")||sp.parentNode;
    if(sp.offsetWidth>box.clientWidth+1)sp.classList.add("wide")})}
  release(); var rt; addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(release,150)});
  /* a chapter that was hidden had no width to measure: measure again when it opens */
  document.addEventListener("tm:view",release);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(release);
})();

/* ---------------- diagrams at their own size ----------------
   A drawing shows at about its natural size on a laptop instead of ballooning to the column.
   Up to ~480 wide it shrinks into a phone column with labels still readable; a wider one would
   drop its labels to ~6px, so it keeps ~72% of its width and the figure scrolls sideways. */
$$("figure.viz svg[viewBox],figure.diagram svg[viewBox]").forEach(function(sv){
  var vb=(sv.getAttribute("viewBox")||"").trim().split(/[\s,]+/), w=parseFloat(vb[2]);
  if(!w)return;
  sv.style.maxWidth=Math.round(w*1.15)+"px";
  if(w>500)sv.style.minWidth=Math.round(Math.min(w,700)*.72)+"px";
});

/* ---------------- shared SVG arrowheads ---------------- */
(function(){
  var NS="http://www.w3.org/2000/svg", sv=document.createElementNS(NS,"svg");
  sv.setAttribute("width","0"); sv.setAttribute("height","0");
  sv.setAttribute("style","position:absolute;pointer-events:none");
  sv.innerHTML='<defs>'+
    '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" '+
      'orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker>'+
    '<marker id="ah-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" '+
      'orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>';
  document.body.appendChild(sv);
})();

/* ---------------- seq: sequence diagrams ---------------- */
$$(".seq").forEach(function(sq){
  var actors=$$(".seq-actor",sq), n=actors.length;
  if(!n)return;
  sq.style.gridTemplateColumns="repeat("+n+",minmax(72px,1fr))";
  var row=2;
  $$(".seq-msg,.seq-note",sq).forEach(function(m){
    m.style.gridRow=row++;
    if(m.classList.contains("seq-note"))return;
    var a=parseInt(m.dataset.from,10)||1, b=parseInt(m.dataset.to,10)||1;
    var lo=Math.min(a,b), hi=Math.max(a,b);
    if(a===b){m.style.gridColumn=lo+" / "+(Math.min(lo+1,n)+1); m.classList.add("self","r")}
    else{m.style.gridColumn=lo+" / "+(hi+1); m.classList.add(b>a?"r":"l")}
  });
  var ll=document.createElement("div"); ll.className="seq-lifelines";
  for(var i=0;i<n;i++){var d=document.createElement("i"); d.style.left=((i+.5)/n*100)+"%"; ll.appendChild(d)}
  sq.appendChild(ll);
  /* the actor boxes change height when the webfont lands and when the column narrows,
     and a lifeline pinned to a stale height starts halfway up the actor label */
  function place(){ll.style.top=(actors[0].offsetHeight+6)+"px"}
  requestAnimationFrame(place);
  if(window.ResizeObserver)new ResizeObserver(place).observe(actors[0]);
  else addEventListener("resize",place);
});

/* ---------------- lanes: parallel timelines ---------------- */
$$(".lanes").forEach(function(ls){
  var n=parseInt(ls.dataset.n,10)||12;
  $$(".lane,.lanes-axis",ls).forEach(function(l){l.style.setProperty("--n",n)});
  var ax=$(".lanes-axis",ls);
  if(ax&&!ax.children.length){
    ax.innerHTML="<span></span>";
    for(var i=0;i<n;i++)ax.innerHTML+="<span>"+(i%2?"":i)+"</span>";
  }
});

/* ---------------- walk: step-through explanations ---------------- */
$$(".walk").forEach(function(w){
  var steps=$$(".walk-step",w), code=$(".code",w), i=0;
  if(!steps.length)return;
  var hd=document.createElement("div"); hd.className="walk-h";
  hd.innerHTML='<b>'+esc(w.dataset.title||UI.walk)+'</b>'+
    '<span class="walk-count"></span><div class="walk-dots"></div>'+
    '<div class="walk-nav"><button class="wp" aria-label="'+UI.prev+'">‹</button>'+
    '<button class="wn" aria-label="'+UI.next+'">›</button></div>';
  w.insertBefore(hd,w.firstChild);
  var dots=$(".walk-dots",hd);
  steps.forEach(function(st,k){
    var t=$(".wt",st);
    if(t&&!$(".wn",t)){var b=document.createElement("span");b.className="wn";b.textContent=k+1;t.insertBefore(b,t.firstChild)}
    var d=document.createElement("i"); d.title=String(k+1);
    d.addEventListener("click",function(){show(k)}); dots.appendChild(d);
  });
  function show(k){
    i=Math.max(0,Math.min(steps.length-1,k));
    steps.forEach(function(st,j){st.classList.toggle("on",j===i)});
    $$("i",dots).forEach(function(d,j){d.classList.toggle("on",j===i)});
    $(".walk-count",hd).textContent=(i+1)+" / "+steps.length;
    $(".wp",hd).disabled=(i===0); $(".wn",hd).disabled=(i===steps.length-1);
    if(code)mark(code,steps[i].dataset.hl||"");
  }
  $(".wp",hd).addEventListener("click",function(){show(i-1)});
  $(".wn",hd).addEventListener("click",function(){show(i+1)});
  w.tabIndex=0;
  w.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){e.preventDefault();show(i+1)}
    else if(e.key==="ArrowLeft"){e.preventDefault();show(i-1)}
  });
  show(0);
});

/* ---------------- tabs ---------------- */
$$(".tabs").forEach(function(tb){
  var panes=$$(".tab",tb);
  if(!panes.length)return;
  var hd=document.createElement("div"); hd.className="tabs-h";
  tb.insertBefore(hd,tb.firstChild);
  panes.forEach(function(pn,k){
    var btn=document.createElement("button");
    btn.textContent=pn.dataset.title||("Tab "+(k+1));
    btn.addEventListener("click",function(){
      panes.forEach(function(x,j){x.classList.toggle("on",j===k)});
      $$("button",hd).forEach(function(x,j){x.classList.toggle("on",j===k)});
    });
    hd.appendChild(btn);
  });
  $$("button",hd)[0].classList.add("on"); panes[0].classList.add("on");
});

/* ---------------- figure numbering ---------------- */
chapters.forEach(function(ch,ci){
  var k=0;
  $$("figure.viz,figure.diagram",ch).forEach(function(f){
    k++;
    var cap=$("figcaption",f);
    if(!cap){cap=document.createElement("figcaption");f.appendChild(cap)}
    if(!$(".fign",cap)){
      var n=document.createElement("span"); n.className="fign";
      n.textContent=UI.figFmt.replace("{c}",ci+1).replace("{k}",k);
      cap.insertBefore(n,cap.firstChild);
    }
  });
});

/* ---------------- equation numbering ---------------- */
chapters.forEach(function(ch,ci){
  var k=0;
  $$(".math[data-eq]",ch).forEach(function(m){
    k++;
    if(!$(".eqn",m)){var e=document.createElement("span");e.className="eqn";
      e.textContent="("+(ci+1)+"."+k+")";m.appendChild(e)}
  });
});

/* ---------------- checklists ---------------- */
$$(".check").forEach(function(ul,ui){
  var key="check:"+(ul.dataset.id||("c"+ui)), done=store.get(key,[]);
  $$("li",ul).forEach(function(li,i){
    if(!$(".bx",li)){var b=document.createElement("span");b.className="bx";b.textContent="✓";
      li.insertBefore(b,li.firstChild)}
    if(done.indexOf(i)>-1)li.classList.add("on");
    li.addEventListener("click",function(){
      var k=done.indexOf(i);
      if(k>-1)done.splice(k,1); else done.push(i);
      li.classList.toggle("on",k===-1);
      store.set(key,done);
    });
  });
});

/* ---------------- flashcard decks ---------------- */
$$(".cards").forEach(function(dk,di){
  var all=$$(".fc",dk); if(!all.length)return;
  var key="cards:"+(dk.dataset.id||("d"+di));
  var known=store.get(key,[]), queue=[], cur=0;

  var hd=document.createElement("div"); hd.className="cards-h";
  hd.innerHTML='<b>'+esc(dk.dataset.title||UI.cards)+'</b><span class="cards-count"></span>';
  dk.insertBefore(hd,dk.firstChild);
  var stage=document.createElement("div"); stage.className="cards-stage";
  all.forEach(function(c){stage.appendChild(c)});
  dk.appendChild(stage);
  var ft=document.createElement("div"); ft.className="cards-f";
  ft.innerHTML='<button class="no">↺ '+esc(UI.again)+'</button><button class="ok">✓ '+esc(UI.known)+'</button>';
  dk.appendChild(ft);
  var fin=document.createElement("div"); fin.className="cards-done";
  fin.innerHTML='✓ <button class="no" style="margin-inline-start:10px">↺</button>';
  dk.appendChild(fin);

  all.forEach(function(c,i){
    if(!$(".fc-hint",c)){var h=document.createElement("div");h.className="fc-hint";
      h.textContent="⇅";c.appendChild(h)}
  });
  function build(){ queue=[]; all.forEach(function(c,i){if(known.indexOf(i)<0)queue.push(i)}); cur=0 }
  function show(){
    dk.classList.toggle("done",!queue.length);
    $(".cards-count",hd).textContent=queue.length?((cur+1)+" / "+queue.length):"";
    all.forEach(function(c,i){c.classList.toggle("on",queue.length>0&&i===queue[cur]);c.classList.remove("flip")});
  }
  stage.addEventListener("click",function(){
    if(!queue.length)return;
    all[queue[cur]].classList.toggle("flip");
  });
  $(".ok",ft).addEventListener("click",function(){
    if(!queue.length)return;
    known.push(queue[cur]); store.set(key,known);
    queue.splice(cur,1); if(cur>=queue.length)cur=0; show();
  });
  $(".no",ft).addEventListener("click",function(){
    if(!queue.length)return;                       /* empty deck: all[undefined] would throw */
    if(queue.length<2){all[queue[0]].classList.remove("flip");return}
    queue.push(queue.splice(cur,1)[0]); if(cur>=queue.length)cur=0; show();
  });
  $(".no",fin).addEventListener("click",function(){known=[];store.set(key,[]);build();show()});
  build(); show();
});

/* boot */
paint(); route();
})();
</script>
</body>
</html>
