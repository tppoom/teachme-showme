<!doctype html>
<html lang="@@LANG@@" dir="@@DIR@@" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@@TITLE@@</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{var t=JSON.parse(localStorage.getItem('@@COURSE_ID@@:theme')||'null');if(t!=='dark'&&t!=='light')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/*@@FONTS@@*/
/* ============================ TOKENS ============================
   Layout: a study notebook — one chapter on the page at a time, a quiet contents rail beside
   it, a measured text column, worked examples on faint grid paper, defined terms marked with
   a highlighter. Neutrals lean slightly toward the teal accent. */
*,*::before,*::after{box-sizing:border-box}
:root{
  --sbw:296px; --col:700px;
  --bg:#fcfcfa; --elev:#f3f5f3; --sunken:#e9edeb;
  --fg:#17201e; --muted:#4d5956; --faint:#7a8682;
  --line:#e0e5e2; --line2:#cbd2ce;
  --accent:#0e6b63; --accent2:#0b5a53; --on-accent:#fff; --accent-soft:#e2f0ec;
  --mark:rgba(255,212,59,.5); --grid:rgba(23,32,30,.05);
  --ok:#1d7a4c; --ok-soft:#e5f3ea;
  --warn:#9a5600; --warn-soft:#fbf0de;
  --bad:#b9372e; --bad-soft:#fae8e5;
  --info:#285f9f; --info-soft:#e7eef8;
  --code-bg:#f0f3f1; --code-fg:#1d2926; --code-line:#dbe2de; --code-dim:#6d7a76; --code-out:#e8ecea;
  --kw:#8a3db5; --str:#2a7a3f; --num:#a35a00; --com:#7c8985; --fn:#1f5ea6; --op:#b3366f;
  --r:12px; --r-sm:8px;
  --font:"IBM Plex Sans Thai",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
    "Noto Sans Thai",Sarabun,
    "Hiragino Sans","Yu Gothic UI","Noto Sans JP",
    "PingFang SC","Microsoft YaHei","Noto Sans SC",
    "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",
    "Noto Sans Arabic","Geeza Pro","Noto Sans Hebrew",
    "Noto Sans Devanagari","Nirmala UI","Noto Sans",
    "Noto Color Emoji","Apple Color Emoji",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(20,30,28,.05),0 8px 28px rgba(20,30,28,.07);
  --sh-lg:0 16px 56px rgba(20,30,28,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111615; --elev:#161c1b; --sunken:#1d2422;
  --fg:#e3e9e7; --muted:#a6b2ae; --faint:#7b8884;
  --line:#25302d; --line2:#34403c;
  --accent:#5cc6b6; --accent2:#7fd6c8; --on-accent:#0b1513; --accent-soft:#163029;
  --mark:rgba(255,205,70,.26); --grid:rgba(227,233,231,.04);
  --ok:#4fc28b; --ok-soft:#12291e; --warn:#eeb04a; --warn-soft:#2c2212;
  --bad:#f07b70; --bad-soft:#331a18; --info:#82b3ef; --info-soft:#16233a;
  --code-bg:#0c1211; --code-fg:#d6e0dd; --code-line:#1f2a27; --code-dim:#76847f; --code-out:#0f1715;
  --kw:#c9a0ff; --str:#97d6a4; --num:#f0c36b; --com:#6e7d78; --fn:#8cc2ff; --op:#f59fc4;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); --sh-lg:0 16px 56px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111615; --elev:#161c1b; --sunken:#1d2422;
  --fg:#e3e9e7; --muted:#a6b2ae; --faint:#7b8884;
  --line:#25302d; --line2:#34403c;
  --accent:#5cc6b6; --accent2:#7fd6c8; --on-accent:#0b1513; --accent-soft:#163029;
  --mark:rgba(255,205,70,.26); --grid:rgba(227,233,231,.04);
  --ok:#4fc28b; --ok-soft:#12291e; --warn:#eeb04a; --warn-soft:#2c2212;
  --bad:#f07b70; --bad-soft:#331a18; --info:#82b3ef; --info-soft:#16233a;
  --code-bg:#0c1211; --code-fg:#d6e0dd; --code-line:#1f2a27; --code-dim:#76847f; --code-out:#0f1715;
  --kw:#c9a0ff; --str:#97d6a4; --num:#f0c36b; --com:#6e7d78; --fn:#8cc2ff; --op:#f59fc4;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); --sh-lg:0 16px 56px rgba(0,0,0,.6);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

html{-webkit-text-size-adjust:100%;scroll-padding-top:28px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
     font-size:17px;line-height:1.85;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
     font-feature-settings:"kern"}
::selection{background:var(--accent-soft);color:var(--fg)}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
kbd{font-family:var(--mono);font-size:.8em;background:var(--bg);border:1px solid var(--line2);
    border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--fg)}

/* ============================ SIDEBAR ============================ */
#sb{position:fixed;inset-block:0;inset-inline-start:0;width:var(--sbw);background:var(--elev);
    border-inline-end:1px solid var(--line);display:flex;flex-direction:column;z-index:60}
.sb-top{padding:22px 22px 16px;display:block;color:inherit}
.sb-top:hover .sb-title{color:var(--accent)}
.sb-title{font-size:16px;font-weight:700;line-height:1.4;transition:color .15s}
.sb-sub{font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}
.sb-prog{padding:0 22px 16px}
.sb-prog-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);
             margin-bottom:7px;font-variant-numeric:tabular-nums}
.sb-prog-pct{color:var(--accent);font-weight:600}
.track{height:4px;border-radius:99px;background:var(--sunken);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .45s cubic-bezier(.4,0,.2,1)}
.sb-prog-note{color:var(--muted)}
.sb-search{padding:0 16px 12px;position:relative}
.sb-search input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);
                 background:var(--bg);color:var(--fg);font:inherit;font-size:14px;line-height:1.4}
.sb-search input::placeholder{color:var(--faint)}
.sb-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#nav{flex:1;overflow-y:auto;padding:4px 10px 32px;overscroll-behavior:contain;border-top:1px solid var(--line)}
#nav::-webkit-scrollbar{width:8px}
#nav::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.nv-part{font-size:12px;font-weight:600;color:var(--faint);padding:18px 12px 6px;line-height:1.45}
.nv-ch{margin:1px 0}
.nv-a{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:var(--r-sm);
      color:var(--muted);font-size:14px;line-height:1.5;transition:background .14s,color .14s}
.nv-a:hover{background:var(--sunken);color:var(--fg)}
.nv-a.on{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nv-n{flex:none;min-width:1.6em;color:var(--faint);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.nv-a.on .nv-n{color:var(--accent)}
.nv-a.done .nv-n{color:var(--ok)}
.nv-a.done .nv-n span{display:none}
.nv-a.done .nv-n::after{content:"✓"}
.nv-subs{display:none;margin:2px 0 8px;padding-inline-start:calc(12px + 1.6em + 10px)}
.nv-ch.open .nv-subs{display:block}
.nv-sub{display:block;padding:3px 10px 3px 0;font-size:13px;color:var(--faint);line-height:1.5}
.nv-sub:hover{color:var(--fg)}
.nv-sub.on{color:var(--accent)}
.sb-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px}
.ghost{flex:1;padding:7px 10px;border:1px solid transparent;border-radius:var(--r-sm);background:transparent;
       color:var(--muted);font-size:13px;transition:.14s}
.ghost:hover{background:var(--sunken);color:var(--fg)}
.ghost.arm{border-color:var(--bad);color:var(--bad)}

/* search results */
#sr{display:none;padding:8px 10px;overflow-y:auto;flex:1;border-top:1px solid var(--line)}
#sr.on{display:block}
#sr .hit{display:block;padding:9px 12px;border-radius:var(--r-sm);margin-bottom:2px;color:inherit}
#sr .hit:hover{background:var(--sunken)}
#sr .hit b{display:block;font-size:13.5px;font-weight:600;line-height:1.45}
#sr .hit u{font-size:12.5px;color:var(--muted);text-decoration:none;line-height:1.55;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#sr .hit i{display:block;font-size:12px;color:var(--faint);font-style:normal;margin-top:2px}
#sr .hit em{background:var(--mark);font-style:normal;border-radius:2px}
#sr .none{padding:16px 12px;font-size:13.5px;color:var(--faint);text-align:center}

/* ============================ TOPBAR (narrow screens) ============================ */
#top{display:none;position:fixed;top:0;left:0;right:0;height:56px;z-index:70;align-items:center;gap:10px;
     padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));
     background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
     border-bottom:1px solid var(--line)}
#burger{width:38px;height:38px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);
        display:grid;place-items:center;gap:3px;padding:10px 9px;flex:none}
#burger span{display:block;width:100%;height:1.5px;background:var(--fg);border-radius:2px}
#top .t-name{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
#top .t-pct{font-size:12.5px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
#scrim{display:none;position:fixed;inset:0;background:rgba(10,16,15,.5);z-index:59}

/* ============================ MAIN ============================ */
#rp{position:fixed;top:0;inset-inline-start:var(--sbw);inset-inline-end:0;height:3px;z-index:50;pointer-events:none}
#rp i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}
main{margin-inline-start:var(--sbw);padding-block:0 120px;
     padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:var(--col);margin:0 auto}
/* one view at a time: the contents page, or one chapter */
.chapter{display:none}
.chapter.on{display:block}
body.reading .cover{display:none}

/* ============================ HOME / CONTENTS ============================ */
.cover{padding:clamp(48px,9vh,96px) 0 24px}
.cv-title{font-size:clamp(32px,4.6vw,44px);line-height:1.22;font-weight:700;letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
.cv-sub{font-size:19px;color:var(--muted);line-height:1.7;margin:0 0 10px;max-width:56ch}
.cv-meta{font-size:15px;color:var(--faint);margin:0 0 30px;font-variant-numeric:tabular-nums}
.cv-act{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.cta{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border:0;border-radius:var(--r-sm);
     background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;line-height:1.4;transition:background .15s}
.cta:hover{background:var(--accent2)}
.cv-prog{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.cv-map{margin-top:56px}
.cv-map h3{font-size:14px;font-weight:600;color:var(--faint);margin:0 0 6px}
.toc-part{font-size:14px;font-weight:600;color:var(--accent);margin:34px 0 4px;line-height:1.5}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:4px 14px;align-items:baseline;
       padding:14px 4px;border-bottom:1px solid var(--line);color:inherit;transition:background .15s}
.toc li:first-child a{border-top:1px solid var(--line)}
.toc a:hover{background:var(--elev)}
.toc a:hover .toc-t{color:var(--accent)}
.toc-n{font-size:14px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.toc-t{font-size:16.5px;font-weight:600;line-height:1.5;transition:color .15s}
.toc-d{grid-column:2;font-size:14px;color:var(--muted);line-height:1.6}
.toc-m{grid-row:1;grid-column:3;font-size:13px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.toc a.done .toc-n{color:var(--ok)}
.toc a.done .toc-n span{display:none}
.toc a.done .toc-n::after{content:"✓"}
.cv-how{margin-top:40px;font-size:13.5px;color:var(--faint);line-height:1.8;max-width:64ch}
.cv-how b{color:var(--muted);font-weight:600}
#done{display:none;margin:40px 0 0;padding:26px 28px;border-radius:var(--r);background:var(--ok-soft)}
#done.show{display:block}
#done h3{margin:0 0 6px;font-size:20px;font-weight:700;color:var(--ok)}
#done p{margin:0;color:var(--fg);font-size:15.5px}

/* ============================ CHAPTER ============================ */
.chapter{padding-top:clamp(40px,7vh,72px)}
.ch-head{padding-bottom:28px;margin-bottom:36px;border-bottom:1px solid var(--line)}
.ch-label{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:10px;font-variant-numeric:tabular-nums}
.ch-label .ch-time{color:var(--faint);font-weight:400}
.ch-title{font-size:clamp(28px,3.6vw,36px);font-weight:700;letter-spacing:-.012em;line-height:1.3;margin:0 0 14px;text-wrap:balance}
.ch-desc{font-size:18.5px;color:var(--muted);line-height:1.75;margin:0;max-width:60ch}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.tag{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunken);color:var(--muted)}
.tag.beginner{background:var(--ok-soft);color:var(--ok)}
.tag.intermediate{background:var(--warn-soft);color:var(--warn)}
.tag.advanced{background:var(--bad-soft);color:var(--bad)}
.tag.core{background:var(--accent-soft);color:var(--accent)}

.ch-body h2{font-size:24px;font-weight:700;letter-spacing:-.008em;line-height:1.45;margin:60px 0 16px;scroll-margin-top:28px;text-wrap:balance}
.ch-body h3{font-size:19px;font-weight:600;margin:40px 0 12px;scroll-margin-top:28px}
.ch-body h4{font-size:16px;font-weight:600;margin:28px 0 8px;color:var(--muted)}
.ch-body p{margin:0 0 1.15em}
.ch-body ul,.ch-body ol{margin:0 0 1.3em;padding-inline-start:1.4em}
.ch-body li{margin-bottom:.5em;padding-inline-start:.2em}
.ch-body ul>li::marker{color:var(--accent)}
.ch-body ol>li::marker{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.ch-body li>ul,.ch-body li>ol{margin-top:.5em}
.ch-body .opts,.ch-body .steps,.ch-body .check,.ch-body .timeline{padding-inline-start:0}
.ch-body .opts{margin:0}.ch-body .opts>li{margin:0;padding:0}
.ch-body strong{font-weight:600;color:var(--fg)}
/* a defined term reads like one marked with a highlighter */
.ch-body p>strong,.ch-body li>strong,.ch-body td>strong,.callout p>strong{
  background:linear-gradient(transparent 60%,var(--mark) 60%);padding:0 .1em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.ch-body a{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;
           text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.ch-body a:hover{text-decoration-color:var(--accent)}
.ch-body hr{border:none;border-top:1px solid var(--line);margin:48px 0}
.ch-body p code,.ch-body li code,td code,h2 code,h3 code,h4 code,.callout code,summary code,.q-t code,.fb code,.res code,.eg-h code{
  font-family:var(--mono);font-size:.84em;background:var(--sunken);padding:.12em .4em;border-radius:5px;color:var(--fg);
  white-space:normal;overflow-wrap:anywhere;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- objective ---------- */
.objective{background:var(--accent-soft);border-radius:var(--r);padding:20px 24px;margin:0 0 40px}
.objective .ob-h{font-size:13.5px;font-weight:600;color:var(--accent);margin-bottom:8px}
.objective ul{margin:0;padding-inline-start:20px}
.objective li{margin-bottom:6px;font-size:16px;line-height:1.7}
.objective li:last-child{margin-bottom:0}

/* ---------- callouts: a tinted note, no side rail ---------- */
.callout{padding:18px 22px;border-radius:var(--r);margin:32px 0;background:var(--elev)}
.callout .ic{display:none}
.callout .co{min-width:0}
.callout .co>:last-child{margin-bottom:0}
.callout .ct{font-weight:600;margin-bottom:6px;font-size:14px;line-height:1.5}
.callout p{font-size:16px;line-height:1.8;margin-bottom:10px}
.callout.note{background:var(--info-soft)} .callout.note .ct{color:var(--info)}
.callout.tip{background:var(--ok-soft)} .callout.tip .ct{color:var(--ok)}
.callout.warn{background:var(--warn-soft)} .callout.warn .ct{color:var(--warn)}
.callout.pitfall{background:var(--bad-soft)} .callout.pitfall .ct{color:var(--bad)}
.callout.key{background:var(--accent-soft)} .callout.key .ct{color:var(--accent)}
.callout.key p{font-size:17.5px;font-weight:500}

/* ---------- worked example: on grid paper, like working it out in a notebook ---------- */
.eg{margin:32px 0;padding:20px 24px 22px;border:1px solid var(--line2);border-radius:var(--r);
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:22px 22px;background-position:-1px -1px}
.eg>.eg-h{display:block;font-size:14px;font-weight:600;color:var(--accent);margin:0 0 10px;line-height:1.5}
.eg>:last-child{margin-bottom:0}
.eg p{margin-bottom:.8em}
.eg .code,.eg .tw,.eg figure.viz{margin:14px 0}
.eg .code:last-child,.eg .tw:last-child{margin-bottom:0}
.eg ol,.eg ul{margin-bottom:12px}
.eg .res{display:block;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2);font-weight:600;line-height:1.7}

/* ---------- concept cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:32px 0}
.card{background:var(--elev);border-radius:var(--r);padding:18px 20px}
.card .c-ic{display:none}
.card .c-t{font-weight:600;font-size:16px;margin-bottom:6px}
.card .c-d{font-size:15px;color:var(--muted);line-height:1.75}
.card .c-d>:last-child{margin-bottom:0}

/* ---------- code ---------- */
.code{margin:32px 0;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--code-line);background:var(--code-bg)}
.code-hd{display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border-bottom:1px solid var(--code-line)}
.dots{display:none}
.code-fn{font-family:var(--mono);font-size:12.5px;color:var(--code-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-lg{font-family:var(--mono);font-size:11px;color:var(--code-dim);letter-spacing:.04em}
.copy{border:1px solid var(--code-line);background:transparent;color:var(--code-dim);font-size:12px;
      padding:2px 9px;border-radius:6px;transition:.15s;line-height:1.6}
.copy:hover{color:var(--code-fg);border-color:var(--code-dim)}
.copy.ok{color:var(--ok);border-color:var(--ok)}
.code pre{margin:0;padding:15px 0;overflow-x:auto;font-family:var(--mono);font-size:13.5px;
          line-height:1.7;color:var(--code-fg);tab-size:2}
.code pre::-webkit-scrollbar{height:9px}
.code pre::-webkit-scrollbar-thumb{background:var(--code-line);border-radius:99px}
.t-kw{color:var(--kw)}.t-str{color:var(--str)}.t-num{color:var(--num)}
.t-com{color:var(--com);font-style:italic}.t-fn{color:var(--fn)}.t-op{color:var(--op)}
/* a short plain block (a URL, what someone sees, a line of output) needs no title bar */
.code.bare{position:relative}
.code.bare .code-hd{position:absolute;top:8px;inset-inline-end:8px;padding:0;border:0;z-index:1}
.code.bare .code-hd .code-fn{display:none}
.code.bare pre{padding-inline-end:56px}
.code-out{border-top:1px solid var(--code-line);background:var(--code-out);padding:11px 18px 13px;font-family:var(--mono);
          font-size:13px;color:var(--code-fg);white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}
.code-out::before{content:"output";display:block;font-size:11px;letter-spacing:.06em;color:var(--code-dim);
                  margin-bottom:4px;font-family:var(--mono)}

/* ---------- tables: rules, not boxes ---------- */
.tw{overflow-x:auto;margin:32px 0}
.tw table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.65}
.tw table:has(tr>:nth-child(6)){min-width:560px}
.tw th{text-align:start;padding:10px 14px 10px 0;font-weight:600;font-size:14px;color:var(--muted);
       border-bottom:1.5px solid var(--line2);vertical-align:bottom}
.tw td{padding:11px 14px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tw tr:last-child td{border-bottom:none}
.tw td:first-child,.tw th:first-child{padding-inline-start:0}

/* ---------- steps ---------- */
.steps{counter-reset:s;margin:32px 0;padding:0;list-style:none}
.steps>li{counter-increment:s;position:relative;padding:0 0 22px;padding-inline-start:44px;margin:0}
.steps>li::before{content:counter(s);position:absolute;inset-inline-start:0;top:.15em;width:28px;height:28px;border-radius:99px;
                  border:1.5px solid var(--accent);color:var(--accent);font-size:13.5px;font-weight:600;display:grid;place-items:center;
                  background:var(--bg);font-variant-numeric:tabular-nums}
.steps>li:not(:last-child)::after{content:"";position:absolute;inset-inline-start:13.5px;top:calc(.15em + 32px);bottom:6px;width:1px;background:var(--line2)}
.steps>li:last-child{padding-bottom:0}
.steps>li>b:first-child{display:block;margin-bottom:2px;font-weight:600}

/* ---------- compare ---------- */
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:32px 0}
.cmp>div,.grid>.card,.tab,.ex-b,.walk-steps{min-width:0}
.cmp>div{border-radius:var(--r);padding:18px 20px;background:var(--elev);font-size:15.5px}
.cmp>div p:last-child{margin-bottom:0}
.cmp .bad{background:var(--bad-soft)}
.cmp .good{background:var(--ok-soft)}
.cmp h5{margin:0 0 8px;font-size:14px;font-weight:600}
.cmp .bad h5{color:var(--bad)}.cmp .good h5{color:var(--ok)}
.cmp .code{margin:0}

/* ---------- diagram ---------- */
.diagram{text-align:center}
.diagram svg{max-width:100%;height:auto}

/* ---------- exercise ---------- */
.ex{margin:40px 0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.ex-h{padding:14px 22px;display:flex;gap:10px;align-items:center;background:var(--elev)}
.ex-h .ic{display:none}
.ex-h b{font-size:15.5px;font-weight:600}
.ex-b{padding:20px 22px}
.ex-b>:last-child{margin-bottom:0}
.ex details{margin-top:14px;border-top:1px dashed var(--line2);padding-top:14px}
.ex summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--accent);list-style:none;
            display:inline-flex;align-items:center;gap:8px;user-select:none}
.ex summary::-webkit-details-marker{display:none}
.ex summary::before{content:"▶";font-size:9px;transition:.2s}
.ex details[open] summary::before{transform:rotate(90deg)}
.ex details>div{margin-top:14px}
.ex details>div>:last-child{margin-bottom:0}

/* ---------- more: optional depth, collapsed ---------- */
details.more{margin:28px 0;border:1px solid var(--line);border-radius:var(--r)}
details.more>summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:15px;line-height:1.55;
  color:var(--muted);list-style:none;display:flex;gap:10px;align-items:baseline;user-select:none;border-radius:var(--r)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▶";font-size:9px;color:var(--accent);transition:.2s;flex:none}
details.more[open]>summary::before{transform:rotate(90deg)}
details.more>summary:hover{color:var(--fg);background:var(--elev)}
details.more>div{padding:4px 18px 16px;font-size:16px}
details.more>div>:last-child{margin-bottom:0}

/* ---------- quiz ---------- */
.quiz{margin:48px 0 0;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.quiz-h{padding:12px 20px;background:var(--elev);font-size:14px;font-weight:600;color:var(--accent);
        display:flex;justify-content:space-between;align-items:center;gap:10px}
.quiz-h .score{font-weight:400;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.q{padding:22px 20px}
.q+.q{border-top:1px solid var(--line)}
.q-t{font-weight:600;margin:0 0 14px;font-size:16.5px;line-height:1.7}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.opt{width:100%;text-align:start;display:block;position:relative;padding:11px 14px;padding-inline-start:46px;
     border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);color:var(--fg);
     font-size:15.5px;line-height:1.65;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.6}
.opt .dot{position:absolute;inset-inline-start:14px;top:13px;width:22px;height:22px;border-radius:99px;border:1.5px solid var(--line2);
          display:grid;place-items:center;font-size:11.5px;font-weight:600;line-height:1;color:var(--muted)}
.opt code{white-space:normal}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .dot{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.right .dot::after{content:"✓"}
.opt.right .dot span{display:none}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .dot{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.wrong .dot::after{content:"✕"}
.opt.wrong .dot span{display:none}
.fb{display:none;margin-top:14px;padding:14px 16px;border-radius:var(--r-sm);font-size:15.5px;line-height:1.8;background:var(--elev)}
.fb.show{display:block}
.fb b{color:var(--accent);font-weight:600}
.fb.ok{background:var(--ok-soft)} .fb.ok b{color:var(--ok)}
.fb.no{background:var(--bad-soft)}
.fb .why{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line2);color:var(--bad)}
.quiz-again{margin-inline-start:auto;width:28px;height:28px;border-radius:99px;border:1px solid var(--line2);
  background:var(--bg);color:var(--accent);font-size:14px;line-height:1;padding:0}
.quiz-again:hover{border-color:var(--accent)}
.quiz-again[hidden]{display:none}

/* ---------- recap ---------- */
.recap{margin:48px 0 0;padding:20px 24px;border-radius:var(--r);background:var(--elev)}
.recap h4{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.recap ul{margin:0;padding-inline-start:21px}
.recap li{margin-bottom:8px;font-size:16px;line-height:1.75}
.recap li:last-child{margin-bottom:0}

/* ---------- chapter end: mark it read, then the next chapter ---------- */
.ch-foot{margin-top:64px;padding-top:28px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.ch-foot-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.mark{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);border:1px solid var(--line2);
      background:var(--bg);color:var(--fg);font-weight:600;font-size:15px;line-height:1.4;transition:.15s}
.mark:hover{border-color:var(--ok);color:var(--ok)}
.mark.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.prev-link{font-size:14.5px;color:var(--muted)}
.prev-link:hover{color:var(--accent)}
.next-card{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 16px;padding:18px 22px;
           border:1px solid var(--line2);border-radius:var(--r);color:inherit;transition:border-color .15s,background .15s}
.next-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.nc-l{font-size:13.5px;color:var(--muted);font-weight:600}
.nc-t{grid-column:1;font-size:18px;font-weight:600;line-height:1.5}
.nc-a{grid-column:2;grid-row:1/span 2;font-size:22px;color:var(--accent)}
.next-card.home .nc-t{font-size:16px}

/* ---------- appendix ---------- */
.gl{margin:32px 0;border-top:1px solid var(--line)}
.gl-i{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.gl-i dt{font-weight:600;color:var(--fg)}
.gl-i dd{margin:0;color:var(--muted);line-height:1.7}

/* ============================ VISUALS ============================ */
figure.viz,figure.diagram{margin:44px 0;padding:32px 28px 24px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--elev);overflow-x:auto}
figure.viz>figcaption,figure.diagram>figcaption{margin-top:22px;font-size:12.5px;color:var(--faint);
  text-align:center;line-height:1.6;padding-top:12px;border-top:1px solid var(--line)}
figcaption .fign{font-weight:800;color:var(--accent);letter-spacing:.03em}
.viz-t{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);
  margin-bottom:20px;text-align:center}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:13px;height:13px;border-radius:3.5px;display:block;border:1.5px solid var(--line2)}
.legend i.a{background:var(--accent);border-color:var(--accent)}
.legend i.g{background:var(--ok);border-color:var(--ok)}
.legend i.r{background:var(--bad);border-color:var(--bad)}
.legend i.d{background:transparent;border-style:dashed;border-color:var(--faint)}

/* ---------- flow: boxes and labelled arrows ---------- */
.flow{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.flow.v{flex-direction:column;align-items:stretch;max-width:340px;margin:0 auto}
.flow .node{padding:11px 16px;border:1.5px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);
  font-size:13.5px;font-weight:650;text-align:center;line-height:1.35}
.flow .node small{display:block;font-size:11px;font-weight:500;color:var(--faint);margin-top:3px}
.flow .node.hi{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.flow .node.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.flow .node.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.flow .node.dim{border-style:dashed;border-color:var(--faint);color:var(--faint)}
.flow .node.round{border-radius:99px}
.flow .arrow{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-end;
  color:var(--faint);min-width:46px;padding:0 2px}
.flow .arrow b{font-size:10.5px;font-weight:650;color:var(--muted);white-space:nowrap;margin-bottom:1px}
.flow .arrow::after{content:"→";font-size:19px;line-height:1;color:var(--accent)}
.flow.v .arrow{min-width:0;padding:2px 0}
.flow.v .arrow::after{content:"↓"}
.flow .arrow.back::after{content:"↩"}
.flow .arrow.dim::after{color:var(--faint)}

/* ---------- stack: layers ---------- */
.stack{display:flex;flex-direction:column;gap:6px;max-width:440px;margin:0 auto}
.stack .layer{padding:13px 16px;border:1.5px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);
  text-align:center;font-weight:650;font-size:14px}
.stack .layer small{display:block;font-weight:500;font-size:11.5px;color:var(--faint);margin-top:3px}
.stack .layer.hi{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stack .layer.dim{border-style:dashed;border-color:var(--faint);color:var(--faint);background:transparent}

/* ---------- cells: arrays, memory, buffers ---------- */
.cells{display:flex;justify-content:center;flex-wrap:wrap;padding:26px 0 30px}
.cells .cell{min-width:58px;padding:13px 10px;border:1.5px solid var(--line2);margin-left:-1.5px;
  text-align:center;font-family:var(--mono);font-size:13.5px;background:var(--bg);position:relative}
.cells .cell:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);margin-left:0}
.cells .cell:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.cells .cell i{position:absolute;top:-20px;left:0;right:0;font-size:10.5px;font-style:normal;
  color:var(--faint);font-family:var(--font)}
.cells .cell b{position:absolute;bottom:-23px;left:0;right:0;font-size:10.5px;color:var(--accent);
  font-family:var(--font);font-weight:750;white-space:nowrap}
.cells .cell.hi{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);z-index:1}
.cells .cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);z-index:1}
.cells .cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);z-index:1}
.cells .cell.free{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--sunken) 5px,var(--sunken) 10px);color:var(--faint)}

/* ---------- tree: hierarchies, file layouts ---------- */
.tree{font-family:var(--mono);font-size:13.2px;line-height:1.9;max-width:620px;margin:0 auto;
  white-space:pre;text-align:left;color:var(--muted);overflow-x:auto}
.tree b{color:var(--fg);font-weight:700}
.tree u{color:var(--accent);text-decoration:none;font-weight:700}
.tree i{color:var(--faint);font-style:normal;font-family:var(--font);font-size:12.3px}

/* ---------- seq: sequence / protocol diagrams ---------- */
.seq{display:grid;position:relative;min-width:330px;max-width:660px;margin:0 auto;padding-bottom:6px}
.seq-actor{grid-row:1;text-align:center;font-weight:700;font-size:12.8px;padding:9px 6px;
  border:1.5px solid var(--line2);border-radius:var(--r-sm);background:var(--bg);margin:0 5px 16px;z-index:1}
.seq-actor.hi{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seq-lifelines{position:absolute;left:0;right:0;bottom:0;pointer-events:none;z-index:0}
.seq-lifelines i{position:absolute;top:0;bottom:0;width:1.5px;background:var(--line);transform:translateX(-50%)}
.seq-msg{position:relative;font-size:12.2px;color:var(--muted);text-align:center;padding:0 12px 24px;
  align-self:start;z-index:1;line-height:1.4}
.seq-msg::before{content:"";position:absolute;left:9px;right:9px;bottom:13px;height:1.5px;background:var(--accent)}
.seq-msg::after{content:"";position:absolute;bottom:9.2px;border:5px solid transparent}
.seq-msg.r::after{right:5px;border-left-color:var(--accent);border-right-width:0}
.seq-msg.l::after{left:5px;border-right-color:var(--accent);border-left-width:0}
.seq-msg.dashed::before{background:repeating-linear-gradient(90deg,var(--faint) 0 6px,transparent 6px 11px)}
.seq-msg.dashed.r::after{border-left-color:var(--faint)}
.seq-msg.dashed.l::after{border-right-color:var(--faint)}
.seq-msg.self{padding-bottom:26px}
.seq-msg.self::before{left:50%;right:12%;bottom:13px;height:1.5px}
.seq-note{grid-column:1/-1;text-align:center;font-size:11.5px;color:var(--faint);padding:2px 0 14px;z-index:1}

/* ---------- lanes: parallel timelines, concurrency, pipelines ---------- */
.lanes{max-width:640px;margin:0 auto;font-size:12.5px}
.lane{display:grid;grid-template-columns:86px repeat(var(--n,12),1fr);align-items:center;margin-bottom:7px}
.lane>b{font-family:var(--mono);font-size:11.8px;color:var(--muted);padding-right:11px;text-align:right;
  overflow:hidden;text-overflow:ellipsis}
.lane .seg{grid-column:calc(var(--s) + 2)/span var(--w);height:31px;display:grid;place-items:center;
  background:var(--accent-soft);border:1.5px solid var(--accent);color:var(--accent);border-radius:6px;
  padding:0 7px;font-weight:650;font-size:11.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane .seg.wait{background:var(--sunken);border-color:var(--faint);color:var(--muted);border-style:dashed}
.lane .seg.block{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.lane .seg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.lanes-axis{display:grid;grid-template-columns:86px repeat(var(--n,12),1fr);font-size:10px;
  color:var(--faint);margin-top:4px}
.lanes-axis span{text-align:center}
.lanes-axis span:first-child{text-align:right;padding-right:11px}

/* ---------- bars: quantitative comparison ---------- */
.bars{display:flex;flex-direction:column;gap:11px;max-width:560px;margin:0 auto}
.bars .b{display:grid;grid-template-columns:132px 1fr 68px;gap:12px;align-items:center;font-size:13.3px}
.bars .b>span:first-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .bar{height:23px;border-radius:6px;background:var(--sunken);overflow:hidden}
.bars .bar i{display:block;height:100%;width:var(--p,0%);border-radius:6px;background:var(--accent)}
.bars .bar.g i{background:linear-gradient(90deg,var(--ok),var(--ok))}
.bars .bar.r i{background:linear-gradient(90deg,var(--bad),var(--bad))}
.bars .v{text-align:right;font-family:var(--mono);font-size:12.3px;color:var(--muted)}

/* ---------- inline SVG helpers ----------
   These must apply to figure.diagram as well as figure.viz. Scoped to .viz alone, an SVG
   in a .diagram inherits nothing, so its text falls back to black and disappears entirely
   in dark mode. Both wrappers are legal per blocks.html, so both get the theme. */
figure.viz svg,figure.diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.viz svg text,figure.diagram svg text{fill:var(--fg);font-family:var(--font);font-size:13px}
.d-box{fill:var(--bg);stroke:var(--line2);stroke-width:1.5}
.d-box.hi{fill:var(--accent-soft);stroke:var(--accent)}
.d-box.ok{fill:var(--ok-soft);stroke:var(--ok)}
.d-box.bad{fill:var(--bad-soft);stroke:var(--bad)}
.d-box.dim{stroke-dasharray:5 4;stroke:var(--faint)}
.d-line{stroke:var(--line2);stroke-width:1.5;fill:none}
.d-line.dim{stroke:var(--faint);stroke-dasharray:5 4}
.d-arrow{stroke:var(--accent);stroke-width:2;fill:none;marker-end:url(#ah)}
.d-arrow.dim{stroke:var(--faint);marker-end:url(#ah-dim)}
.d-fill{fill:var(--accent-soft)}
/* these sit on <text>, so they must outrank "figure svg text" above */
figure svg text.d-dim,.d-dim{fill:var(--faint);font-size:11.5px}
.d-accent{fill:var(--accent)}
.d-ok{fill:var(--ok)} .d-bad{fill:var(--bad)}
figure svg text.d-mono,.d-mono{font-family:var(--mono);font-size:12px}
figure svg text.d-sm,.d-sm{font-size:11px}
#ah path{fill:var(--accent)}
#ah-dim path{fill:var(--faint)}

/* ---------- images in prose ----------
   Without this a hand-written <img> at its natural pixel size widens the whole column and
   the page scrolls sideways on every screen narrower than the image. */
.ch-body img,.cover img{max-width:100%;height:auto}
figure.viz>img,figure.diagram>img{border-radius:var(--r-sm);border:1px solid var(--line)}
/* long identifiers, URLs and hashes must wrap rather than widen the page */
.ch-body p,.ch-body li,.ch-body dd,.callout,.fb{overflow-wrap:anywhere}
.ch-body td,.ch-body th{overflow-wrap:break-word}
.tw td{font-variant-numeric:tabular-nums}
.cv-sub:empty,.sb-sub:empty,.ch-desc:empty{display:none}
.nwa{white-space:nowrap}.nwa.wide{white-space:normal}
:is(:lang(th),:lang(lo),:lang(my),:lang(km)) :is(.cv-title,.ch-title,.ch-body h2){text-wrap:balance}

/* ---------- code line highlighting ---------- */
.code pre{padding:17px 0}
.code .ln{display:block;padding:0 18px;width:max-content;min-width:100%}
.code .ln:empty::after{content:"\00a0"}
.code .ln.hl{background:color-mix(in srgb,var(--accent) 17%,transparent);box-shadow:inset 3px 0 0 var(--accent)}
.code.numbered .ln::before{content:attr(data-n);display:inline-block;width:2.1em;margin-right:16px;
  color:var(--code-dim);text-align:right;user-select:none;font-variant-numeric:tabular-nums}
.code-out{padding-inline:18px}

/* ---------- walk: step-through explanations ---------- */
.walk{margin:44px 0;border:1.5px solid var(--line2);border-radius:var(--r);overflow:hidden;background:var(--elev)}
.walk-h{padding:11px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  background:var(--accent-soft)}
.walk-h>b{font-size:13.8px;flex:1;color:var(--accent);line-height:1.35}
.walk-count{font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;opacity:.8;white-space:nowrap}
.walk-dots{display:flex;gap:5px}
.walk-dots i{width:7px;height:7px;border-radius:99px;background:var(--line2);cursor:pointer;
  transition:.15s;display:block}
.walk-dots i.on{background:var(--accent);transform:scale(1.4)}
.walk-nav{display:flex;gap:5px}
.walk-nav button{width:29px;height:29px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);
  color:var(--fg);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.walk-nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.walk-nav button:disabled{opacity:.3;cursor:default}
.walk .code{margin:0;border-radius:0;border-left:0;border-right:0;border-top:0}
.walk-steps{padding:22px 24px;background:var(--elev)}
.walk-step{display:none}
.walk-step.on{display:block;animation:wfade .22s ease-out}
@keyframes wfade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.walk-step>:last-child{margin-bottom:0}
.walk-step .wt{font-weight:700;font-size:14.5px;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.walk-step .wn{width:23px;height:23px;border-radius:99px;background:var(--accent);color:var(--on-accent);
  font-size:11.5px;font-weight:800;display:grid;place-items:center;flex:none}
.walk-step p{font-size:14px;line-height:1.8;margin-bottom:12px}

/* ---------- tabs ---------- */
.tabs{margin:36px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tabs-h{display:flex;gap:3px;background:var(--elev);border-bottom:1px solid var(--line);
  padding:7px 7px 0;overflow-x:auto}
.tabs-h button{padding:8px 15px;border:none;background:transparent;color:var(--muted);font-size:13.3px;
  font-weight:650;border-radius:8px 8px 0 0;white-space:nowrap}
.tabs-h button.on{background:var(--bg);color:var(--accent)}
.tab{display:none;padding:24px}
.tab.on{display:block}
.tab>:first-child{margin-top:0}
.tab>:last-child{margin-bottom:0}




/* ============================ FORMAL & MATH ============================ */
.math{margin:36px 0;padding:24px;background:var(--elev);border:1px solid var(--line);
  border-radius:var(--r);overflow-x:auto;text-align:center;position:relative}
.math[data-eq]{padding-inline-end:62px}
.math .eqn{position:absolute;inset-inline-end:18px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:12.5px;color:var(--faint)}
math{font-size:1.16em}
math[display="block"]{margin:0 auto}
.frac{display:inline-flex;flex-direction:column;vertical-align:-.45em;text-align:center;
  font-size:.86em;line-height:1.16;margin:0 2px}
.frac>i{font-style:normal;padding:0 4px}
.frac>i:first-child{border-bottom:1px solid currentColor}
.where{margin:-20px 0 36px;padding:18px 22px;border-inline-start:3px solid var(--line2);
  background:var(--sunken);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:14px}
.where .wh{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);margin-bottom:9px}
.where .w{display:grid;grid-template-columns:86px 1fr;gap:12px;margin-bottom:7px;align-items:baseline}
.where .w:last-child{margin-bottom:0}
.where .w b{font-family:var(--mono);color:var(--accent);text-align:end;direction:ltr}
.where .w span{color:var(--muted);line-height:1.55}

.derive{margin:36px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.derive .dv{display:grid;grid-template-columns:1fr 42%;border-bottom:1px solid var(--line)}
.derive .dv:last-child{border-bottom:none}
.derive .dv:hover{background:var(--elev)}
.derive .dx{padding:13px 16px;text-align:center;direction:ltr;overflow-x:auto}
.derive .dr{padding:13px 16px;font-size:13.4px;color:var(--muted);background:var(--elev);
  border-inline-start:1px solid var(--line);display:flex;align-items:center}

.formal{margin:36px 0;padding:22px 26px;border-radius:var(--r);background:var(--elev);
  border:1px solid var(--line);border-inline-start:4px solid var(--accent)}
.formal .fl{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:9px}
.formal .fl em{font-style:normal;color:var(--fg);text-transform:none;letter-spacing:0;
  font-weight:700;margin-inline-start:9px;font-size:13.5px}
.formal>:last-child{margin-bottom:0}
.formal.defn{border-inline-start-color:var(--info)} .formal.defn .fl{color:var(--info)}
.formal.law{border-inline-start-color:var(--warn)}  .formal.law .fl{color:var(--warn)}
.formal.proof{border-inline-start-color:var(--faint);background:transparent}
.formal.proof .fl{color:var(--faint)}
.formal.proof>p:last-of-type::after{content:" ∎";font-weight:700;color:var(--accent)}

/* ============================ LANGUAGE LEARNING ============================ */
ruby{ruby-position:over}
rt{font-size:.55em;color:var(--muted);font-weight:500}
.vocab{margin:36px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vocab .vr{display:grid;grid-template-columns:minmax(112px,1.05fr) minmax(88px,.75fr) 1.5fr;
  border-bottom:1px solid var(--line)}
.vocab .vr:last-child{border-bottom:0}
.vocab .vr:hover{background:var(--elev)}
.vocab .vr.hd{background:var(--elev);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);font-weight:750}
.vocab .vr.hd>*{padding:9px 16px;font-size:11.5px}
.vocab .vt{padding:12px 16px;font-size:17px;font-weight:650;line-height:1.55}
.vocab .vp{padding:12px 16px;font-size:13px;color:var(--muted);font-family:var(--mono);direction:ltr}
.vocab .vm{padding:12px 16px;font-size:14.3px;border-inline-start:1px solid var(--line);line-height:1.6}
.vocab .vx{display:block;margin-top:6px;font-size:13px;color:var(--faint)}

.dlg{margin:36px 0;display:flex;flex-direction:column;gap:16px}
.dlg .turn{display:grid;grid-template-columns:66px 1fr;gap:12px}
.dlg .turn>b{font-size:12.5px;color:var(--accent);text-align:end;padding-top:12px;font-weight:750}
.dlg .say{padding:12px 16px;background:var(--elev);border:1px solid var(--line);border-radius:var(--r-sm)}
.dlg .say p{margin:0;font-size:16.5px;line-height:1.65}
.dlg .say .gloss{display:block;margin-top:7px;font-size:13.2px;color:var(--muted);font-style:italic}
.dlg .turn.b .say{background:var(--accent-soft);
  border-color:color-mix(in srgb,var(--accent) 26%,transparent)}

.annot{margin:36px 0;padding:24px 20px;background:var(--elev);border:1px solid var(--line);
  border-radius:var(--r);display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
  gap:14px 8px;font-size:19px;line-height:1.5}
.annot .pc{display:inline-flex;flex-direction:column;align-items:center;max-width:100%}
.annot .pc>*,.annot .pc{overflow-wrap:anywhere}
.annot .pc::after{content:attr(data-l);order:2;margin-top:6px;padding-top:5px;border-top:2px solid var(--accent);
  align-self:stretch;text-align:center;font-size:11.5px;line-height:1.3;color:var(--accent);font-weight:750}
.annot .pc.a2::after{color:var(--ok);border-top-color:var(--ok)}
.annot .pc.a3::after{color:var(--warn);border-top-color:var(--warn)}
.annot .pc.a4::after{color:var(--info);border-top-color:var(--info)}

/* ============================ SOURCES & TIME ============================ */
.quote{margin:36px 0;padding:22px 26px;border-inline-start:4px solid var(--accent);
  background:var(--elev);border-radius:0 var(--r) var(--r) 0;font-size:15.5px;line-height:1.85}
.quote p{margin:0 0 10px}
.quote .tr{display:block;margin:10px 0;padding-top:10px;border-top:1px dashed var(--line2);
  font-size:14.3px;color:var(--muted)}
.quote cite{display:block;font-size:12.8px;color:var(--faint);font-style:normal}
.quote cite::before{content:"— "}

.timeline{list-style:none;margin:36px 0;padding:0}
.timeline>li{position:relative;padding:0 0 30px;padding-inline-start:112px}
.timeline>li::before{content:"";position:absolute;inset-inline-start:92px;top:6px;width:12px;height:12px;
  border-radius:99px;background:var(--accent);box-shadow:0 0 0 3.5px var(--accent-soft)}
.timeline>li::after{content:"";position:absolute;inset-inline-start:97.5px;top:20px;bottom:-2px;
  width:1.5px;background:var(--line)}
.timeline>li:last-child{padding-bottom:0}
.timeline>li:last-child::after{display:none}
.timeline .when{position:absolute;inset-inline-start:0;top:0;width:80px;text-align:end;
  font-size:12.5px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5}
.timeline b{display:block;font-size:15px;margin-bottom:6px}
.timeline p{margin:0;font-size:14px;color:var(--muted);line-height:1.65}
.timeline>li.hi::before{background:var(--bad);box-shadow:0 0 0 3.5px var(--bad-soft)}
.steps>li em.t{font-style:normal;display:inline-block;margin-inline-start:9px;font-size:11.5px;
  font-weight:750;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:99px}

/* ============================ FLASHCARDS & CHECKLIST ============================ */
.cards{margin:44px 0;border:1.5px solid var(--line2);border-radius:var(--r);background:var(--elev);overflow:hidden}
.cards-h{padding:11px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
  background:var(--accent-soft)}
.cards-h>b{flex:1;font-size:13.8px;color:var(--accent)}
.cards-count{font-size:11.5px;color:var(--accent);opacity:.85;font-variant-numeric:tabular-nums}
.cards-stage{padding:28px 20px;min-height:168px;display:grid;place-items:center;text-align:center;
  cursor:pointer;user-select:none}
.fc{display:none}
.fc.on{display:block;animation:wfade .2s}
.fc .fc-f{font-size:23px;font-weight:700;line-height:1.55}
.fc .fc-b{display:none;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line2);
  font-size:16.5px;color:var(--muted);line-height:1.7}
.fc.flip .fc-b{display:block}
.fc-hint{margin-top:15px;font-size:11.5px;color:var(--faint)}
.fc.flip .fc-hint{visibility:hidden}
.cards-f{display:flex;gap:9px;padding:12px 15px;border-top:1px solid var(--line);justify-content:center}
.cards-f button{padding:8px 17px;border-radius:99px;border:1.5px solid var(--line2);background:var(--bg);
  color:var(--muted);font-size:13px;font-weight:650}
.cards-f button.ok{border-color:var(--ok);color:var(--ok)}
.cards-f button.no{border-color:var(--warn);color:var(--warn)}
.cards-done{display:none;padding:30px;text-align:center;color:var(--ok);font-weight:700;font-size:16px}
.cards.done .cards-stage,.cards.done .cards-f{display:none}
.cards.done .cards-done{display:block}

.check{list-style:none;margin:36px 0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.check li{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line);
  cursor:pointer;font-size:14.5px;line-height:1.7}
.check li:last-child{border-bottom:0}
.check li:hover{background:var(--elev)}
.check li .bx{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line2);
  display:grid;place-items:center;font-size:11px;color:transparent;margin-top:2px;transition:.14s}
.check li.on .bx{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.check li.on{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line2)}

/* ---------- typed-answer quiz ---------- */
.q .ans-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.q .ans{flex:1;min-width:180px;max-width:360px;padding:10px 14px;border:1.5px solid var(--line2);
  border-radius:var(--r-sm);background:var(--bg);color:var(--fg);font-size:15px;font-family:inherit}
.q .ans.right{border-color:var(--ok);background:var(--ok-soft)}
.q .ans.wrong{border-color:var(--bad);background:var(--bad-soft)}
.q .ans-go{padding:10px 18px;border-radius:var(--r-sm);border:1.5px solid var(--accent);
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14px}
.q .ans-go:disabled{opacity:.4;cursor:default}


/* ============================ RTL ============================ */
/* Layout flips via logical properties; these are the pieces that cannot. */
[dir="rtl"] .lane>b,[dir="rtl"] .lanes-axis span:first-child{text-align:left;padding-right:0;padding-left:11px}
[dir="rtl"] .bars .v{text-align:left}
[dir="rtl"] .flow .arrow::after{content:"←"}
[dir="rtl"] .flow.v .arrow::after{content:"↓"}
[dir="rtl"] .ex summary::before{content:"◀"}
[dir="rtl"] .ex details[open] summary::before{transform:rotate(-90deg)}
[dir="rtl"] details.more>summary::before{content:"◀"}
[dir="rtl"] details.more[open]>summary::before{transform:rotate(-90deg)}
[dir="rtl"] .nc-a{transform:scaleX(-1)}
/* Code, formulas and technical diagrams are always read left-to-right. */
.code,.code pre,.math,.derive,.tree,.seq,.lanes,.cells,figure.viz svg{direction:ltr}
.code pre,.tree{text-align:left}
[dir="rtl"] figure.viz>figcaption,[dir="rtl"] .viz-t{direction:rtl}

/* ============================ RESPONSIVE ============================ */
@media (max-width:1180px){ :root{--sbw:272px} main{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))} }
@media (max-width:960px){
  #top{display:flex}
  #rp{inset-inline-start:0;top:calc(56px + env(safe-area-inset-top,0px))}
  main{margin-inline-start:0;padding-top:56px;
       padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  /* the topbar is fixed, so every in-page anchor has to clear it */
  html{scroll-padding-top:72px}
  .ch-body h2,.ch-body h3{scroll-margin-top:72px}
  #sb{transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);width:min(86vw,330px);
      box-shadow:var(--sh-lg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  [dir="rtl"] #sb{transform:translateX(100%)}
  body.menu #sb{transform:none}
  body.menu #scrim{display:block}
}
@media (max-width:640px){
  body{font-size:16.5px;line-height:1.82}
  .cover{padding-top:36px}
  .cv-sub{font-size:17px}
  .chapter{padding-top:32px}
  .ch-title{font-size:27px}
  .ch-desc{font-size:17px}
  .ch-body h2{font-size:21px;margin-top:48px}
  .toc a{grid-template-columns:2em minmax(0,1fr);padding:13px 2px}
  .toc-m{grid-row:auto;grid-column:2}
  .cmp{grid-template-columns:minmax(0,1fr)}
  /* on a phone a sideways scroller hides the end of a URL or a line of output — wrap it */
  .code.plain pre code{white-space:pre-wrap;overflow-wrap:anywhere}
  .code.plain .ln{width:auto}
  .code pre{font-size:13px}
  .flow{flex-direction:column;align-items:stretch;max-width:340px;margin:0 auto}
  .flow .arrow{min-width:0;padding:2px 0;flex-direction:row;justify-content:center;gap:8px}
  .flow .arrow::after,[dir="rtl"] .flow .arrow::after{content:"↓"}
  .flow .arrow b{margin:0}
  .tw table{font-size:14.5px}
  .tw th,.tw td{padding-inline-end:10px}
  .annot{font-size:16.5px;padding:20px 14px}
  .eg{padding:16px 16px 18px}
  .gl-i{grid-template-columns:1fr;gap:2px}
  .callout,.ex-b,.walk-steps,.recap,.formal,.q{padding-inline:16px}
  figure.viz,figure.diagram{margin:32px 0;padding:18px 14px 16px}
  .seq{font-size:11.4px;min-width:290px}
  .seq-actor{font-size:11.6px;padding:8px 3px;margin:0 3px 14px}
  .lane,.lanes-axis{grid-template-columns:58px repeat(var(--n,12),1fr)}
  .lane>b{font-size:11px;padding-right:8px}
  .bars .b{grid-template-columns:92px 1fr 56px;gap:9px;font-size:12.5px}
  .walk-h{flex-wrap:wrap;gap:9px}
  .walk-h>b{flex:1 0 100%}
  .derive .dv{grid-template-columns:1fr}
  .derive .dr{border-inline-start:0;border-top:1px dashed var(--line)}
  .vocab .vr{grid-template-columns:1fr 1fr}
  .vocab .vm{grid-column:1/-1;border-inline-start:0;border-top:1px dashed var(--line)}
  .timeline>li{padding-inline-start:76px}
  .timeline>li::before{inset-inline-start:56px}
  .timeline>li::after{inset-inline-start:61.5px}
  .timeline .when{width:46px}
  .where .w{grid-template-columns:64px 1fr}
  .dlg .turn{grid-template-columns:48px 1fr}
  .fc .fc-f{font-size:20px}
  .cells .cell{min-width:48px;padding:11px 7px;font-size:12.5px}
  .next-card{padding:16px 18px}
  .nc-t{font-size:16.5px}
}
@media print{
  #sb,#top,#scrim,#rp,.ch-foot,.cta,.copy,.cv-how{display:none!important}
  main{margin:0;max-width:none;padding:0}
  .chapter,body.reading .cover{display:block!important}
  .chapter{page-break-before:always}
  .ex details{display:block}
  .eg{background-image:none}
  .walk-step,.tab{display:block!important}
  .fc{display:block!important;page-break-inside:avoid;margin-bottom:10px}
  .fc .fc-b{display:block!important}
  .cards-f,.cards-h .cards-count{display:none!important}
  .walk-dots,.walk-nav{display:none!important}
  figure.viz,.walk,.tabs{break-inside:avoid}
  a{color:inherit}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

</style>
</head>
<body>
<div id="scrim"></div>

<header id="top">
  <button id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <a class="t-name" href="#home">@@TITLE@@</a>
  <span class="t-pct">0%</span>
</header>

<nav id="sb" aria-label="Course navigation">
  <a class="sb-top" href="#home"><div class="sb-title">@@TITLE@@</div><div class="sb-sub">@@SUBTITLE@@</div></a>
  <div class="sb-prog">
    <div class="sb-prog-row"><span class="sb-prog-note"></span><span class="sb-prog-pct">0%</span></div>
    <div class="track"><i class="fill"></i></div>
  </div>
  <div class="sb-search"><input id="q" type="search" placeholder="@@T_SEARCH@@" aria-label="@@T_SEARCH@@" autocomplete="off"></div>
  <div id="nav"></div>
  <div id="sr"></div>
  <div class="sb-foot">
    <button class="ghost" id="themeBtn" type="button">@@T_THEME@@</button>
    <button class="ghost" id="resetBtn" type="button">@@T_RESET@@</button>
  </div>
</nav>

<div id="rp"><i></i></div>

<main>
<div class="wrap">

  <section class="cover" id="home">
    <h1 class="cv-title">@@TITLE@@</h1>
    <p class="cv-sub">@@SUBTITLE@@</p>
    <div class="cv-meta"></div>
    <div class="cv-act"><button class="cta" id="startBtn" type="button">@@T_START@@ →</button><span class="cv-prog"></span></div>
    <div id="done"><h3>@@T_DONEH@@</h3><p>@@T_DONEP@@</p></div>
    <div class="cv-map"><h3>@@T_CONTENTS@@</h3><div class="toc-wrap"></div></div>
    <div class="cv-how">@@T_HOWTO@@</div>
  </section>

<!--@@CHAPTERS@@-->

</div>
</main>

<script>
(function(){
"use strict";
var CID = "@@COURSE_ID@@";
/* UI strings — translate these to the course language */
var UI = {
  chapter:"@@T_CHAPTER@@", chapterFmt:"@@T_CHAPTERFMT@@", markDone:"@@T_MARK@@", doneLabel:"@@T_MARKED@@",
  prev:"@@T_PREV@@", next:"@@T_NEXT@@", copy:"⧉", copied:"✓",
  ofDoneFmt:"@@T_OFDONEFMT@@", resetAsk:"@@T_RESETASK@@", noHit:"@@T_NOHIT@@", minRead:"@@T_MIN@@",
  figFmt:"@@T_FIGFMT@@", walk:"@@T_WALK@@", cards:"@@T_CARDS@@", known:"@@T_KNOWN@@", again:"@@T_AGAIN@@",
  answerPh:"@@T_ANSWERPH@@", topics:"@@T_TOPICS@@", examples:"@@T_EXAMPLES@@", visuals:"@@T_VISUALS@@",
  quiz:"@@T_QUIZ@@", read:"@@T_READ@@", retry:"@@T_RESET@@",
  hoursFmt:"@@T_HOURSFMT@@", resume:"@@T_RESUME@@", contents:"@@T_CONTENTS@@"
};
var RTL = document.documentElement.dir === "rtl";
function chNum(n){return UI.chapterFmt.replace("{n}",n)}

var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var store={
  get:function(k,d){try{var v=localStorage.getItem(CID+":"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(CID+":"+k,JSON.stringify(v))}catch(e){}},
  del:function(k){try{localStorage.removeItem(CID+":"+k)}catch(e){}}
};
var chapters=$$(".chapter");
var doneSet=store.get("done",[]);
var isDone=function(id){return doneSet.indexOf(id)>-1};

/* ---------------- syntax highlight ---------------- */
var KW=("abstract as async await base bool break byte case catch chan char class const constexpr continue "+
"declare def default defer del delete do double elif else elseif end enum event except export extends false "+
"final finally float fn for from func function global go goto if impl implements import in include init instanceof "+
"int interface is lambda let let* line long loop map match mod module mut namespace new nil nonlocal not null "+
"nullptr operator or override package pass print private protected pub public raise range readonly rec record "+
"ref register return select self short signed sizeof static str string struct super switch sync template then "+
"this throw throws trait true try type typedef typeof union unsafe unsigned use using val var virtual void "+
"where while with yield and elsewhere").split(/\s+/);
var KWRE=new RegExp("\\b("+KW.join("|")+")\\b","g");
var esc=function(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")};
function hlLines(src,lang){
  lang=(lang||"").toLowerCase();
  var hash=/^(py|python|sh|bash|zsh|shell|rb|ruby|yaml|yml|toml|ini|r|perl|makefile|dockerfile|conf|nix|elixir)$/.test(lang);
  var dash=/^(sql|lua|hs|haskell|ada|elm)$/.test(lang);
  var plain=/^(text|txt|output|log|json|csv|diff|none)$/.test(lang);
  var lines=[""];
  function kwize(t){return esc(t).replace(KWRE,'<span class="t-kw">$1</span>')}
  function add(cls,text){
    var segs=String(text).split("\n");
    for(var i=0;i<segs.length;i++){
      if(i)lines.push("");
      if(!segs[i])continue;
      lines[lines.length-1]+= cls ? '<span class="'+cls+'">'+esc(segs[i])+'</span>'
                                  : (plain?esc(segs[i]):kwize(segs[i]));
    }
  }
  if(plain){add(null,src);return lines}
  /* '#'-comment languages have no '//' comments: a URL in yaml or a path in sh is not one */
  var parts=[hash?"(#[^\\n]*":"(/\\*[\\s\\S]*?\\*/|//[^\\n]*"];
  if(dash) parts.push("|--[^\\n]*");
  parts.push(")|(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'|`(?:\\\\.|[^`\\\\])*`)");
  parts.push("|\\b(0[xXbBoO][0-9a-fA-F_]+|\\d[\\d_]*(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)\\b");
  parts.push("|([A-Za-z_$][\\w$]*)(?=\\s*\\()");
  var re=new RegExp(parts.join(""),"g"), last=0, m;
  while((m=re.exec(src))!==null){
    add(null,src.slice(last,m.index));
    if(m[1])      add("t-com",m[1]);
    else if(m[2]) add("t-str",m[2]);
    else if(m[3]) add("t-num",m[3]);
    else if(m[4]) add(KW.indexOf(m[4])>-1?"t-kw":"t-fn",m[4]);
    last=re.lastIndex;
  }
  add(null,src.slice(last));
  return lines;
}
/* highlight a set of source lines: "3", "3-5", "3-5,9,12-14" */
function mark(box,spec){
  $$(".ln",box).forEach(function(l){l.classList.remove("hl")});
  if(!spec)return;
  String(spec).split(",").forEach(function(part){
    var r=part.trim().split("-"), a=parseInt(r[0],10), b=parseInt(r[1]||r[0],10);
    if(isNaN(a))return;
    for(var i=a;i<=b;i++){var el=box.querySelector('.ln[data-n="'+i+'"]'); if(el)el.classList.add("hl")}
  });
}
$$(".code pre code").forEach(function(c){
  var lang=(c.className.match(/(?:lang|language)-([\w+#-]+)/)||[])[1]||"";
  var raw=c.textContent.replace(/^\n+|\s+$/g,"");
  c.dataset.raw=raw;
  c.innerHTML=hlLines(raw,lang).map(function(l,i){
    return '<span class="ln" data-n="'+(i+1)+'">'+l+'</span>'}).join("");
  var box=c.closest(".code");
  if(box.hasAttribute("data-lines"))box.classList.add("numbered");
  if(box.dataset.hl)mark(box,box.dataset.hl);
  var plainLang=!lang||/^(text|txt|output|plain|none)$/i.test(lang);
  if(plainLang)box.classList.add("plain");
  if(plainLang&&!box.dataset.file&&!box.closest(".walk"))box.classList.add("bare");
  if(!$(".code-hd",box)){
    var hd=document.createElement("div"); hd.className="code-hd";
    hd.innerHTML='<div class="dots"><i></i><i></i><i></i></div>'+
      '<span class="code-fn">'+esc(box.dataset.file||"")+'</span>'+
      (lang&&!/^(text|txt|output|plain|none)$/i.test(lang)?'<span class="code-lg">'+esc(lang)+'</span>':'')+
      '<button class="copy" title="copy">'+UI.copy+'</button>';
    box.insertBefore(hd,box.firstChild);
  }
});
document.addEventListener("click",function(e){

/* ---------------- quizzes (multiple choice + typed answer) ---------------- */
function norm(t){return String(t).trim().toLowerCase().replace(/\s+/g," ")
  .replace(/[.,;:!?。、，！？]+$/,"")}
function shuffle(list){for(var i=list.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=list[i];list[i]=list[j];list[j]=t}return list}
$$(".quiz").forEach(function(qz){
  var qs=$$(".q",qz), total=qs.length, got=0, done=0, resets=[];
  var hd=$(".quiz-h",qz);
  if(hd&&!hd.textContent.trim())hd.innerHTML="<span>"+esc(UI.quiz)+"</span>";
  var sc=hd&&$(".score",hd);
  if(hd&&!sc){sc=document.createElement("span");sc.className="score";hd.appendChild(sc)}
  var again=document.createElement("button"); again.className="quiz-again"; again.type="button";
  again.textContent="↻"; again.title=UI.retry; again.setAttribute("aria-label",UI.retry); again.hidden=true;
  if(sc)sc.parentNode.insertBefore(again,sc);
  function paint(){if(sc)sc.textContent=got+" / "+total; again.hidden=done<total}
  function bump(ok){done++;if(ok)got++;paint()}
  paint();
  again.addEventListener("click",function(){got=0;done=0;resets.forEach(function(r){r()});paint();
    qz.scrollIntoView({block:"nearest",behavior:"smooth"})});

  qs.forEach(function(q){
    var fb=$(".fb",q), answered=false;
    function showFb(ok,why){
      if(!fb)return;
      fb.classList.add("show",ok?"ok":"no");
      if(why){var w=document.createElement("div");w.className="why";w.textContent=why;fb.insertBefore(w,fb.firstChild)}
    }
    function hideFb(){if(!fb)return;fb.classList.remove("show","ok","no");var w=$(".why",fb);if(w)w.remove();
      var s2=$(".sol",fb);if(s2)s2.remove()}

    if(q.dataset.answer!==undefined){                       /* --- typed answer --- */
      var accept=q.dataset.answer.split("|").map(norm);
      var row=document.createElement("div"); row.className="ans-row";
      var inp=document.createElement("input"); inp.className="ans"; inp.type="text";
      inp.placeholder=UI.answerPh; inp.autocomplete="off"; inp.spellcheck=false;
      var go=document.createElement("button"); go.className="ans-go"; go.textContent="↵";
      row.appendChild(inp); row.appendChild(go);
      /* without a .fb to anchor to, insertBefore(row, null) would append to the QUIZ,
         dropping the input box outside its own question */
      if(fb)q.insertBefore(row,fb); else q.appendChild(row);
      var submit=function(){
        if(answered||!inp.value.trim())return;
        answered=true; inp.disabled=true; go.disabled=true;
        var ok=accept.indexOf(norm(inp.value))>-1;
        inp.classList.add(ok?"right":"wrong");
        showFb(ok);
        if(!ok&&fb){var sol=document.createElement("div");sol.className="sol";sol.style.marginTop="8px";
          sol.innerHTML='<b>'+esc(q.dataset.answer.split("|")[0])+'</b>';fb.appendChild(sol)}
        bump(ok);
      };
      go.addEventListener("click",submit);
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submit()}});
      resets.push(function(){answered=false;inp.disabled=false;go.disabled=false;inp.value="";
        inp.classList.remove("right","wrong");hideFb()});
      return;
    }

    /* --- multiple choice --- the author's option order is never trusted: a correct answer that
       always lands in the same slot teaches the pattern, not the subject. Questions whose
       options have a natural order ("1, 2, 3", "always / sometimes / never") opt out with
       data-order="fixed". */
    var list=$(".opts",q), items=list?$$(":scope>li",list):[];
    function order(){if(q.dataset.order==="fixed"||items.length<2)return;
      shuffle(items.slice()).forEach(function(li){list.appendChild(li)});
      $$(".opt .dot",q).forEach(function(d){d.remove()});letter()}
    function letter(){$$(".opt",q).forEach(function(o,i){var d=document.createElement("span");
      d.className="dot";d.innerHTML="<span>"+String.fromCharCode(65+i)+"</span>";o.insertBefore(d,o.firstChild)})}
    var opts=$$(".opt",q);
    letter(); order();
    opts.forEach(function(o){
      o.addEventListener("click",function(){
        if(answered)return; answered=true;
        var ok=o.dataset.correct==="true";
        opts.forEach(function(x){x.disabled=true;
          if(x.dataset.correct==="true")x.classList.add("right");
          else if(x===o)x.classList.add("wrong")});
        showFb(ok,ok?"":o.dataset.why);          /* the misconception behind the option they picked */
        bump(ok);
      });
    });
    resets.push(function(){answered=false;opts.forEach(function(x){x.disabled=false;
      x.classList.remove("right","wrong")});hideFb();order()});
  });
});

/* word count that also works for scripts without spaces (CJK, Thai, Lao, Khmer, Burmese) */
function wordCount(t){
  var cjk=(t.match(/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff66-\uff9f\uac00-\ud7af]/g)||[]).length;
  var nosp=(t.match(/[\u0e00-\u0e7f\u0e80-\u0eff\u1000-\u109f\u1780-\u17ff]/g)||[]).length;
  var rest=t.replace(/[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff66-\uff9f\uac00-\ud7af\u0e00-\u0e7f\u0e80-\u0eff\u1000-\u109f\u1780-\u17ff]/g," ");
  return rest.trim().split(/\s+/).filter(Boolean).length + Math.round(cjk/2.5) + Math.round(nosp/5);
}

/* ---------------- build nav, contents and chapter ends ---------------- */
var nav=$("#nav"), tocWrap=$(".toc-wrap"), totalMin=0, index=[];
var info=chapters.map(function(ch,i){
  var n=i+1, id=ch.id||("ch-"+n); ch.id=id;
  var app=ch.classList.contains("appendix");
  var title=ch.dataset.title||(($(".ch-title",ch)||{}).textContent||"").trim()||chNum(n);
  var desc=(($(".ch-desc",ch)||{}).textContent||"").trim();
  var mins=parseInt(ch.dataset.min||"0",10)||Math.max(3,Math.round(wordCount(ch.textContent)/190));
  ch.dataset.min=mins; totalMin+=mins;
  return {ch:ch,id:id,n:n,app:app,title:title,desc:desc,mins:mins,part:ch.dataset.part||"",num:app?"A":String(n)};
});
var lastPart=null, tocList=null;
info.forEach(function(c,i){
  var ch=c.ch, id=c.id;

  if(lbl&&!lbl.textContent.trim())
    lbl.innerHTML=(c.app?"":esc(chNum(c.n))+' ')+'<span class="ch-time">'+(c.app?"":"· ")+"~"+c.mins+" "+esc(UI.minRead)+'</span>';

  /* parts group the contents when chapters carry data-part */
  if(c.part!==lastPart||!tocList){

      var np=document.createElement("div"); np.className="nv-part"; np.textContent=c.part; nav.appendChild(np);

    }

  /* nav entry */
  var wrapEl=document.createElement("div"); wrapEl.className="nv-ch"; wrapEl.dataset.for=id;
  var a=document.createElement("a"); a.className="nv-a"; a.href="#"+id;
  a.innerHTML='<span class="nv-n"><span>'+c.num+'</span></span><span class="nv-x">'+esc(c.title)+'</span>';
  wrapEl.appendChild(a);
  var subs=document.createElement("div"); subs.className="nv-subs";
  var heads=$$(".ch-body h2",ch);
  heads.forEach(function(h,k){

    var sa=document.createElement("a"); sa.className="nv-sub"; sa.href="#"+h.id; sa.textContent=h.textContent;
    subs.appendChild(sa);
    /* index everything up to the next h2, not just the first sibling — otherwise most of
       the course is invisible to search and "/" finds only headings */
    var body="", nx=h.nextElementSibling, stop=heads[k+1];
    while(nx&&nx!==stop){body+=" "+nx.textContent; nx=nx.nextElementSibling}
    index.push({t:h.textContent,ch:c.title,href:"#"+h.id,body:body,snip:body.replace(/\s+/g," ").trim()});
  });
  if(subs.children.length)wrapEl.appendChild(subs);
  nav.appendChild(wrapEl);
  index.push({t:c.title,ch:c.app?"":chNum(c.n),href:"#"+id,body:c.desc,snip:c.desc});

  /* contents row */
  var li=document.createElement("li"), ta=document.createElement("a");
  ta.href="#"+id; ta.dataset.ch=id;
  ta.innerHTML='<span class="toc-n"><span>'+c.num+'</span></span><span class="toc-t">'+esc(c.title)+'</span>'+
    '<span class="toc-m">~'+c.mins+' '+esc(UI.minRead)+'</span>'+(c.desc?'<span class="toc-d">'+esc(c.desc)+'</span>':"");
  li.appendChild(ta); tocList.appendChild(li);

  /* chapter end: mark it read, then the next chapter as the obvious way on */
  var ft=$(".ch-foot",ch)||document.createElement("footer");
  ft.className="ch-foot"; ft.innerHTML="";
  var row=document.createElement("div"); row.className="ch-foot-row";
  var mk=document.createElement("button"); mk.className="mark"; mk.type="button"; mk.dataset.ch=id;
  row.appendChild(mk);
  if(i>0){var pv=document.createElement("a"); pv.className="prev-link"; pv.href="#"+info[i-1].id;
    pv.textContent=(RTL?"→ ":"← ")+UI.prev; row.appendChild(pv)}
  ft.appendChild(row);
  var nc=document.createElement("a"); nc.className="next-card";
  if(i<info.length-1){var nxt=info[i+1]; nc.href="#"+nxt.id;
    nc.innerHTML='<span class="nc-l">'+esc(UI.next)+(nxt.app?"":" · "+esc(chNum(nxt.n)))+'</span>'+
      '<span class="nc-t">'+esc(nxt.title)+'</span><span class="nc-a" aria-hidden="true">→</span>'}
  else{nc.href="#home"; nc.classList.add("home");
    nc.innerHTML='<span class="nc-l">'+esc(UI.contents)+'</span><span class="nc-t">'+esc(document.title)+
      '</span><span class="nc-a" aria-hidden="true">→</span>'}
  ft.appendChild(nc);
  if(!ft.parentNode)ch.appendChild(ft);
});

/* ---------------- one view at a time: the contents, or one chapter ---------------- */
var cur=null, TITLE=document.title;
function go(id){if(location.hash==="#"+id)route(); else location.hash=id}
function show(ch){
  if(cur===ch)return;
  cur=ch;
  chapters.forEach(function(c){c.classList.toggle("on",c===ch)});
  document.body.classList.toggle("reading",!!ch);
  $$(".nv-a").forEach(function(a){a.classList.toggle("on",!!ch&&a.getAttribute("href")==="#"+ch.id)});
  $$(".nv-ch").forEach(function(w){w.classList.toggle("open",!!ch&&w.dataset.for===ch.id)});
  $("#top .t-name").textContent=ch?(ch.dataset.title||($(".ch-title",ch)||{}).textContent||""):TITLE;
  if(ch){
    store.set("last",ch.id);
    var on=$(".nv-a.on");
    if(on){var r=on.getBoundingClientRect(), nr=nav.getBoundingClientRect();
      if(r.top<nr.top+10||r.bottom>nr.bottom-10)on.scrollIntoView({block:"center"})}
  }
  paint();
  document.dispatchEvent(new Event("tm:view"));
}
function route(){
  var h="";
  try{h=decodeURIComponent(location.hash.slice(1))}catch(_){h=location.hash.slice(1)}
  var el=h&&document.getElementById(h);
  var ch=el&&(el.classList.contains("chapter")?el:el.closest(".chapter"));
  if(ch){
    show(ch);
    if(el!==ch)requestAnimationFrame(function(){el.scrollIntoView()});
    else window.scrollTo(0,0);
  } else {show(null); window.scrollTo(0,0)}
  spy();
}
window.addEventListener("hashchange",route);
/* a link to the view already open still does something: back to its top */
document.addEventListener("click",function(e){
  var a=e.target.closest('a[href^="#"]'); if(!a)return;
  if(a.getAttribute("href")===location.hash){e.preventDefault();route()}

/* ---------------- search ---------------- */
var q=$("#q"), sr=$("#sr");
function closeSearch(){q.value="";sr.classList.remove("on");nav.style.display=""}
q.addEventListener("input",function(){
  var v=q.value.trim().toLowerCase();
  if(v.length<2){sr.classList.remove("on");nav.style.display="";return}
  nav.style.display="none"; sr.classList.add("on");
  var hits=index.filter(function(it){return (it.t+" "+it.body).toLowerCase().indexOf(v)>-1}).slice(0,30);
  if(!hits.length){sr.innerHTML='<div class="none">'+UI.noHit+'</div>';return}
  var rx=new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
  sr.innerHTML=hits.map(function(h){
    var t=esc(h.t).replace(rx,"<em>$1</em>");
    /* show the matched phrase in context — a list of headings does not tell you which one
       actually contains what you searched for */
    var snip="", s=h.snip||"", at=s.toLowerCase().indexOf(v);
    if(at>-1){
      var from=Math.max(0,at-38);
      snip=(from?"…":"")+s.slice(from,at+v.length+62).trim()+(at+v.length+62<s.length?"…":"");
      snip='<u>'+esc(snip).replace(rx,"<em>$1</em>")+'</u>';
    }
    return '<a class="hit" href="'+h.href+'"><b>'+t+'</b>'+snip+(h.ch?'<i>'+esc(h.ch)+'</i>':'')+'</a>';
  }).join("");
});
sr.addEventListener("click",function(e){if(e.target.closest(".hit"))closeSearch()});
